# Local development services. Start with `pnpm db:up` from the repo root.
name: opsflow

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      # Require passwords for TCP connections inside the container too (the image
      # defaults loopback to trust). Socket connections stay trust, so db:psql works.
      # Only applied when the data volume is first initialized.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      OPSFLOW_OWNER_PASSWORD: ${OPSFLOW_OWNER_PASSWORD:?set OPSFLOW_OWNER_PASSWORD in .env}
      OPSFLOW_APP_PASSWORD: ${OPSFLOW_APP_PASSWORD:?set OPSFLOW_APP_PASSWORD in .env}
      OPSFLOW_WORKER_PASSWORD: ${OPSFLOW_WORKER_PASSWORD:?set OPSFLOW_WORKER_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # reachable from this Mac only, not the network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/bootstrap-roles.sql:/opsflow/bootstrap-roles.sql:ro
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the socket: during first-run init Postgres listens on the socket
      # only, so this stays unhealthy until bootstrap finishes and it restarts.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d opsflow"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
